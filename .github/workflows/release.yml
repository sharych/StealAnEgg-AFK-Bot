name: Build & Publish Release (Windows + macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (used only for manual trigger, e.g. v5.0.0)'
        required: false
        default: 'v5.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Windows executable
        shell: cmd
        run: |
          call windows\build_windows.bat StealAnEgg_AFK_Fishing_Bot_Windows.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: StealAnEgg_AFK_Fishing_Bot_Windows.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build macOS Universal App (.app)
        run: |
          chmod +x macos/build_mac.sh
          ./macos/build_mac.sh macos/build
          cd macos/build
          zip -r -y ../../StealAnEgg_AFK_Bot_macOS.app.zip StealAnEgg_AFK_Bot.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: StealAnEgg_AFK_Bot_macOS.app.zip

  publish-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-build

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: macos-build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.tag }}
          name: Steal an Egg AFK Bot ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.tag }}
          generate_release_notes: true
          files: |
            StealAnEgg_AFK_Fishing_Bot_Windows.exe
            StealAnEgg_AFK_Bot_macOS.app.zip
