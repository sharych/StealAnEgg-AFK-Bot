name: Build & Publish Release (Windows + macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (used only for manual trigger, e.g. v5.1.0)'
        required: false
        default: 'v5.1.0'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.tag }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Steal an Egg AFK Bot $TAG" --generate-release-notes
          fi

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Windows executable
        shell: cmd
        run: |
          call windows\build_windows.bat StealAnEgg_AFK_Fishing_Bot_Windows.exe

      - name: Upload Windows asset to Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.tag }}
        run: |
          gh release upload "$TAG" StealAnEgg_AFK_Fishing_Bot_Windows.exe --repo "$GITHUB_REPOSITORY" --clobber

  build-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build macOS Universal App (.app)
        run: |
          chmod +x macos/build_mac.sh
          ./macos/build_mac.sh macos/build
          cd macos/build
          zip -r -y ../../StealAnEgg_AFK_Bot_macOS.app.zip StealAnEgg_AFK_Bot.app

      - name: Upload macOS asset to Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.tag }}
        run: |
          gh release upload "$TAG" StealAnEgg_AFK_Bot_macOS.app.zip --repo "$GITHUB_REPOSITORY" --clobber
